<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trajectory Data Status</title>
<style>
  :root { --bg:#1E2320; --card:#262B27; --ink:#E8E6DF; --dim:#9AA39C; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "Public Sans", system-ui, sans-serif; }
  main { max-width:640px; margin:40px auto; padding:0 16px; }
  h1 { font:600 24px/1.2 "Zilla Slab", Georgia, serif; margin:0 0 16px; }
  .card { background:var(--card); border-radius:10px; padding:16px 20px; }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:6px 18px; margin:0; }
  dt { color:var(--dim); font:14px "Courier Prime", ui-monospace, monospace; }
  dd { margin:0; }
  .err { color:#E07A5F; }
</style>
</head>
<body>
<main>
  <h1>ContextClimate · Back Trajectories</h1>
  <div class="card"><dl id="s"><dt>status</dt><dd>loading…</dd></dl></div>
</main>
<script>
const fmt = k => `${k.slice(0,4)}-${k.slice(4,6)}-${k.slice(6,8)} ${k.slice(8,10)}Z`;
Promise.all([fetch('manifest.json', {cache: 'no-store'}).then(r => r.json()),
             fetch('cities.json', {cache: 'no-store'}).then(r => r.json())]).then(([m, c]) => {
  const an = m.arrivals.filter(t => t.kind === 'analysis'), fc = m.arrivals.filter(t => t.kind === 'forecast');
  const rows = [
    ['generated', m.generated.replace('T', ' ')],
    ['latest cycle', m.latestCycle ? fmt(m.latestCycle) : '—'],
    ['arrivals', `${fmt(m.arrivals[0].t)} → ${fmt(m.arrivals[m.arrivals.length - 1].t)} (${an.length} analysis, ${fc.length} forecast)`],
    ['cities', c.cities.length],
    ['heights', m.heights.map(h => h + ' m').join(', ')],
    ['length', `${m.hours} h`],
    ['ensemble', `${m.ensemble.members.length} members`],
    ['source', m.source],
  ];
  document.getElementById('s').innerHTML = rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
}).catch(e => { document.getElementById('s').innerHTML = `<dt>status</dt><dd class="err">${e}</dd>`; });
</script>
</body>
</html>
