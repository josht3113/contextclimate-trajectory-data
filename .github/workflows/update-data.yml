name: Update trajectory data

# Checks hourly; the full build runs only when a GFS cycle newer than the published one
# has its f024 posted on AWS (or the published data is over 9 h old). GitHub's scheduler
# delays and drops runs, so hourly checks publish each cycle within about an hour.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # keepalive: re-enable this workflow so GitHub never auto-disables the schedule

concurrency:
  group: trajectory-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/needs_update.py
          sparse-checkout-cone-mode: false

      - id: decide
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/needs_update.py

      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable" || true

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore data window
        uses: actions/cache/restore@v4
        with:
          path: data
          key: tiles-${{ github.run_id }}
          restore-keys: tiles-

      - name: Build wind tiles
        run: python scripts/build_tiles.py --out data --budget-min 120

      - name: Build city list
        run: |
          mkdir -p data/site
          python scripts/cities.py --out data/site/cities.json --review /tmp/CITIES.md

      - name: Compute trajectories
        run: python scripts/compute_trajectories.py --data data --site data/site --store data/trajstore --budget-min 180

      - name: Save data window
        if: always() && hashFiles('data/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: tiles-${{ github.run_id }}

      - name: Add site files
        run: |
          cp site/index.html data/site/index.html
          touch data/site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: data/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
