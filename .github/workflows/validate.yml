name: Validate against HYSPLIT

# Backfills the reference cases from the GFS archive, runs the reference trajectory
# model and reports separation from READY/HYSPLIT endpoints in the run summary.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Trajectory length to compare (h)"
        default: "24"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py --hours "${{ inputs.hours }}" --report validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: validation
          path: validation.json
